name: timid
description: "A new Flutter project."

publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.2
  cloud_firestore: ^5.6.3
  image_picker: ^1.0.4
  firebase_storage: ^12.4.4
  flutter_card_swiper: ^7.0.2
  flutter_blue_plus: ^1.35.0
  flutter_ble_peripheral: ^1.2.6
  crypto: ^3.0.3
  flutter_launcher_icons: ^0.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path_android: "assets/images/LogoTimid.png"
  image_path_ios: "assets/images/LogoTimid.png"
  adaptive_icon_background: "@color/ic_launcher_background"  
  adaptive_icon_foreground: "assets/images/Logo.png"


flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic
  